<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>育休もらえる？</title>
    <script>
      // GitHub Pages SPA リダイレクト trick
      // 直接 URL アクセス時に pathname + search を sessionStorage に保存してトップへ転送する
      var base = '/';
      var path = location.pathname.slice(base.length - 1); // 先頭の / を残す
      var query = location.search;
      sessionStorage.setItem('spa:redirect', path + query);
      location.replace(base);
    </script>
  </head>
  <body></body>
</html>
